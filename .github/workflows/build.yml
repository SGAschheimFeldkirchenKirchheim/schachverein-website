name: Generate Website

on:
  push:
    branches: [ main ]
  # Täglicher Rebuild, damit "Nächste Termine" und ausgegraute Vergangenheit aktuell bleiben
  schedule:
    - cron: '0 3 * * *'
  # Manuell startbar über den Actions-Tab
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. Typst CLI installieren – mit zweitem Versuch, falls GitHub kurz hakt (z. B. HTTP 504)
      - name: Setup Typst
        id: typst1
        continue-on-error: true
        uses: typst-community/setup-typst@v3

      - name: Setup Typst (2. Versuch)
        id: typst2
        if: steps.typst1.outcome == 'failure'
        continue-on-error: true
        uses: typst-community/setup-typst@v3

      - name: Hinweis ohne Typst
        if: steps.typst1.outcome == 'failure' && steps.typst2.outcome == 'failure'
        run: echo "::warning::Typst nicht verfügbar – Website wird ohne Termine-PDF/SVG gebaut"

      # 2. Python Umgebung einrichten
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # 3. Typst Kompilierung zu SVG
      #    Fehler brechen den Build nicht ab, erscheinen aber als gelbe Warnung im Run
      #    (vorher: "|| true" hat sie komplett versteckt)
      - name: Compile Typst to SVG
        run: |
          if ! command -v typst >/dev/null; then
            echo "Typst fehlt, überspringe."
          elif [ -f "termine/termine.typ" ]; then
            typst compile termine/termine.typ termine/output.svg \
              || echo "::warning::Typst-Kompilierung von termine/termine.typ fehlgeschlagen"
          fi
          # Blitzjahreswertung (SVG + PDF) kompiliert build_site.py selbst

      # 4. Python Build-Skript ausführen
      - name: Run Build Script
        run: python build_site.py

      # 5. Änderungen committen und pushen
      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff-index --quiet HEAD; then
            echo "Keine Änderungen zum Committen vorhanden."
          else
            git commit -m "Auto-generate HTML and SVG files"
            git push
          fi  