name: Generate Website

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Typst CLI mit expliziter Version installieren
      - name: Setup Typst
        uses: typst-community/setup-typst@v3
        with:
          typst-version: latest

      # 2. Python Umgebung einrichten
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # 3. Typst Kompilierung für Blitzjahreswertung
      - name: Compile Typst to HTML
        run: |
          if [ -d "turniere/blitzjahreswertung" ]; then
            cd turniere/blitzjahreswertung
            typst compile main.typ output.html || true
            cd ../..
          fi

      # 4. Python Build-Skript ausführen
      - name: Run Build Script
        run: python build_site.py

      # 5. Änderungen committen und pushen
      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add *.html berichte/*.html
          git diff-index --quiet HEAD || git commit -m "Auto-generate HTML files from Typst"
          git push
