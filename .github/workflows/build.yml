name: Generate Website

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. Typst CLI installieren
      - name: Setup Typst
        uses: typst-community/setup-typst@v3

      # 2. Python Umgebung einrichten
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # 3. Typst Kompilierung zu SVG
      - name: Compile Typst to SVG
        run: |
          if [ -f "turniere/blitzjahreswertung/main.typ" ]; then
            cd turniere/blitzjahreswertung
            typst compile main.typ output.svg || true
            cd ../..
          fi

      # 4. Python Build-Skript ausführen
      - name: Run Build Script
        run: python build_site.py

      # 5. Änderungen committen und pushen
      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add *.html berichte/*.html turniere/blitzjahreswertung/*.svg
          git diff-index --quiet HEAD || git commit -m "Auto-generate HTML and SVG files"
          git push
